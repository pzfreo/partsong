# Partsong's share relay: holds encrypted copies of shared scores so a link can
# bring the whole score (photos included) to Safari, Chrome or the installed
# app. Deploy: npx wrangler deploy (from this directory). Copies are deleted a
# month after upload by the bucket's lifecycle rule (was a year until 11 Nov 2026):
#   npx wrangler r2 bucket lifecycle add partsong-shares expire-30d --expire-days 30
name = "partsong-relay"
main = "index.js"
compatibility_date = "2026-10-01"

[[r2_buckets]]
binding = "SHARES"
bucket_name = "partsong-shares"

[vars]
# The app, and the test site (partsong-test.vercel.app), whose Send link
# otherwise always falls back to a PDF.
ORIGINS = "https://partsong.app,https://partsong-test.vercel.app"
