name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Two jobs, as GitHub's own Pages workflow: deploy-pages straight after the
# upload, in the same job, often found no artifact ("No artifacts named
# github-pages", 3 of 4 pushes on 24-25 Nov; the site is ~290 MB): it isn't
# listed until a moment after uploading. The deploy job starts once it is.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history, to number the version
      # Kept between deploys, so a GitHub release outage (504s) can't stop one.
      - uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('scripts/fetch-models.sh') }}
      - name: Fetch homr's models
        run: scripts/fetch-models.sh
      - name: Fetch the libraries the app serves itself
        run: scripts/fetch-libs.sh
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html privacy.html terms.html help.html learn-your-choir-part.html rehearsal-tracks.html choir-directors.html cpdl.html faq.html whats-new.html f52e18cebc78124fcd0ce6bed3cb1ef1.txt *.js styles.css manifest.webmanifest icon.svg icon-192.png icon-512.png favicon.ico og-image.png robots.txt sitemap.xml \
            omr models lib fonts video _site/
          mkdir -p _site/samples && cp samples/tallis-if-ye-love-me.pdf _site/samples/
      # The version is the number of commits on main: it only ever goes up
      # (v121, v122, ...), and `git rev-list --reverse HEAD | sed -n 121p`
      # gives the commit a version came from.
      - name: Stamp the version onto the app's CSS/JS references
        run: node scripts/stamp-version.mjs _site "$(git rev-list --count HEAD)"
      - name: Check every precached app file is in the site
        run: |
          node -e '
            const fs = require("fs");
            const files = [...fs.readFileSync("sw.js", "utf8").matchAll(/^\s+"([^"]+)",?$/gm)].map((m) => m[1]);
            const missing = files.filter((f) => f !== "./" && !fs.existsSync("_site/" + f));
            if (missing.length) { console.error("Missing from _site:", missing); process.exit(1); }
            console.log("All", files.length, "precached files present");'
      - uses: actions/upload-pages-artifact@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # Once deployed: tell IndexNow (Bing and others) which public pages changed
  # in this push, so they're crawled again soon. Its failing never fails the deploy.
  indexnow:
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ping IndexNow
        run: scripts/indexnow.sh ${{ github.event.before }} ${{ github.sha }} || scripts/indexnow.sh all
