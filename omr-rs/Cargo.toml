[package]
name = "partsong-omr"
version = "0.1.0"
edition = "2021"
description = "Partsong's music reader: homr (via homr-rs) with Partsong's own layout rules, built to WebAssembly"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
homr-rs = { git = "https://github.com/pzfreo/homr-rs", rev = "d6617e8b65b385a287788a1b40a76a991c60c07e" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
