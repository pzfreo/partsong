[package]
name = "partsong-omr"
version = "0.1.0"
edition = "2021"
description = "Partsong's music reader: homr (via homr-rs) with Partsong's own layout rules, built to WebAssembly"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
homr-rs = { git = "https://github.com/pzfreo/homr-rs", rev = "bfae1346deedd48985c2e9c7def31e0a303a4ab1" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
